# Thin caller. The implementation lives ONCE, in THIS org's `.github` — alongside
# format-check, compathelper, autoregister, tagbot, release-drafter and guard-main, which lab
# repos already call from there. This file used to be a hand-rolled `gh pr edit` script, which
# GitHub's Projects-classic sunset broke in every repo at once on 2026-07-28.
#
# Not QAtlasHub's copy: that is a different OWNER, and Actions access, org secrets, runner
# groups and release cadence do not cross the QAtlasHub / lab-sotashimozono / sotashimozono
# boundaries. The workflow body is owner-agnostic, so hosting it here costs a file and removes
# the coupling. Migrating also drops the `@v1` pin: reusables track `@main`, never a tag.
name: PR Labeler
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: write            # addLabels / createLabel are issue-scoped, even on a PR
jobs:
  label:
    uses: lab-sotashimozono/.github/.github/workflows/labeler.yml@main
