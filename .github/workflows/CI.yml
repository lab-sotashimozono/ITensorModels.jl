name: CI
on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# The whole sharded-test vertical lives in TestShards.jl. Nothing is planned up front — each
# shard decides what it owns from the same timing history — and the reusable merges the shards'
# coverage into one Codecov upload, merges their records into one ordered document, checks that
# every unit ran exactly once, and refreshes the `ci-timings` branch on pushes to main.
jobs:
  test:
    permissions:
      contents: write   # the timing history is pushed to the `ci-timings` orphan branch
    uses: QAtlasHub/TestShards.jl/.github/workflows/sharded-tests.yml@main
    with:
      shards: 8
    # The secret is passed to the call and there is deliberately NO caller-side upload job,
    # because this repository is PUBLIC and a public repository can. That is measured, and this
    # repository is the measurement — three callers of the same reusable with the same named
    # `secrets:` block, one variable at a time:
    #
    #   QAtlasHub/DataVault.jl              same org,  PUBLIC     token ARRIVES
    #   lab-sotashimozono/ITensorModels.jl  other org, PUBLIC     token ARRIVES   <- this repo
    #   lab-sotashimozono/ITensorAD.jl      other org, PRIVATE    token EMPTY
    #
    # The first two differ only in the organisation and agree, so it is not the organisation;
    # the last two differ only in visibility and do not. A PRIVATE sibling of this repository
    # needs `coverage-upload: false` plus a `coverage` job running
    # QAtlasHub/TestShards.jl/actions/upload-coverage, which runs inside its own job and so has
    # nothing to cross. See QAtlasHub/TestShards.jl#48.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
