name: CI
on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# The whole sharded-test vertical lives in TestShards.jl. Nothing is planned up front — each
# shard decides what it owns from the same timing history — and the reusable merges the shards'
# coverage into one Codecov upload, merges their records into one ordered document, checks that
# every unit ran exactly once, and refreshes the `ci-timings` branch on pushes to main.
jobs:
  test:
    permissions:
      contents: write   # the timing history is pushed to the `ci-timings` orphan branch
    uses: QAtlasHub/TestShards.jl/.github/workflows/sharded-tests.yml@main
    with:
      shards: 8
    # The secret is passed to the call and there is deliberately NO caller-side upload job,
    # because this repository is the missing control in an experiment that is currently
    # unresolved — and that matters, because the answer decides how eleven more are configured.
    #
    # What is measured so far:
    #
    #   QAtlasHub/DataVault.jl          PUBLIC,  same org as the reusable   token ARRIVES
    #   lab-sotashimozono/ITensorAD.jl  PRIVATE, another org                token EMPTY
    #
    # Two variables differ at once, so neither "the organisation decides it" nor "private
    # repositories decide it" is supported by that pair. This repository is PUBLIC, in ANOTHER
    # organisation, and holds its own CODECOV_TOKEN — it varies only the organisation against
    # DataVault, and only the visibility against ITensorAD.
    #
    # If `collect` uploads, visibility is what matters and the private repos need the
    # caller-side `actions/upload-coverage` job. If it warns that no token arrived, the
    # organisation is what matters and every lab-sotashimozono repo needs it, public or not.
    # See QAtlasHub/TestShards.jl#48.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
